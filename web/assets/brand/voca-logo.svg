<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#000000"/>
  <defs>
    <clipPath id="clip1"><circle cx="136" cy="256" r="50"/></clipPath>
    <clipPath id="clip2"><circle cx="216" cy="256" r="50"/></clipPath>
    <clipPath id="clip3"><circle cx="296" cy="256" r="50"/></clipPath>
  </defs>
  <!-- Circle 1: White -->
  <circle cx="136" cy="256" r="50" fill="#FFFFFF"/>
  <!-- Circle 2: Red -->
  <circle cx="216" cy="256" r="50" fill="#F52235"/>
  <!-- Intersection 1-2: Soft Pink -->
  <circle cx="216" cy="256" r="50" clip-path="url(#clip1)" fill="#FA8C96"/>
  <!-- Circle 3: Yellow -->
  <circle cx="296" cy="256" r="50" fill="#FFCC33"/>
  <!-- Intersection 2-3: Warm Orange -->
  <circle cx="296" cy="256" r="50" clip-path="url(#clip2)" fill="#FC7630"/>
  <!-- Circle 4: Green -->
  <circle cx="376" cy="256" r="50" fill="#16D977"/>
  <!-- Intersection 3-4: Yellow-Green -->
  <circle cx="376" cy="256" r="50" clip-path="url(#clip3)" fill="#88D450"/>
</svg>